name: Create a Preview Update

on:
  pull_request:
    branches: ["preview"]
    types: ["opened", "reopened", "synchronize"]
    paths:
      - apps/ludika-client/**
      - packages/**
      - scripts/eas-affected.sh
      - package.json
      - bun.lock
      - turbo.json

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  detect_changes:
    name: Detect relevant changes
    if: ${{ startsWith(github.event.pull_request.head.ref, 'feat/') || startsWith(github.event.pull_request.head.ref, 'fix/') }}
    outputs:
      affected: ${{ steps.affected.outputs.affected }}
    steps:
      - uses: eas/checkout
      - id: affected
        name: Check whether ludika-client is affected
        working_directory: ../..
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/eas-affected.sh ludika-client "$BASE_SHA" "$HEAD_SHA"

  fingerprint:
    name: Fingerprint
    needs: [detect_changes]
    if: ${{ needs.detect_changes.outputs.affected == 'true' }}
    type: fingerprint
    environment: preview

  get_android_build:
    name: Find compatible Android development build
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      profile: development

  # get_ios_build:
  #   name: Find compatible iOS development build
  #   needs: [fingerprint]
  #   type: get-build
  #   params:
  #     fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
  #     profile: development

  build_android:
    name: Build Android development client
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: development

  # build_ios:
  #   name: Build iOS development client
  #   needs: [get_ios_build]
  #   if: ${{ !needs.get_ios_build.outputs.build_id }}
  #   type: build
  #   params:
  #     platform: ios
  #     profile: development

  publish_preview_update:
    name: Publish PR preview update
    needs: [detect_changes]
    if: ${{ needs.detect_changes.outputs.affected == 'true' }}
    type: update
    environment: preview
    params:
      branch: ${{ github.event.pull_request.head.ref }}
      message: PR #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}

  comment:
    name: Comment preview on PR
    after:
      - detect_changes
      - build_android
      # - build_ios
      - publish_preview_update
    if: ${{ after.detect_changes.outputs.affected == 'true' }}
    type: github-comment
